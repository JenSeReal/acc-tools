[package]
name = "motec-viewer-app"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
motec-viewer-lib = { path = "../lib" }
acc-ui-components = { path = "../../acc-ui-components" }

# CSR dependencies
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = [
    "Event",
    "File",
    "FileList",
    "FileReader",
    "HtmlInputElement",
    "ProgressEvent",
    "Storage",
    "Window",
], optional = true }

[features]
default = []
csr = [
    "leptos/csr",
    "acc-ui-components/csr",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:js-sys",
    "dep:web-sys",
]
hydrate = [
    "leptos/hydrate",
    "acc-ui-components/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:js-sys",
    "dep:web-sys",
]
ssr = [
    "leptos/ssr",
    "acc-ui-components/ssr",
]

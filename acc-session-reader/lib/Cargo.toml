[package]
name = "acc-session-reader-lib"
version = "0.1.0"
edition.workspace = true

[lib]
name = "acc_session_reader_lib"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"
thiserror = "2.0"
miette = { version = "7.0", features = ["fancy"] }
encoding_rs = "0.8"
pdf-extract = "0.7"
nom = "7.1"

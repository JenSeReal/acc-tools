name: Helm Chart
on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/helm-chart.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:
jobs:
  lint:
    runs-on: github-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Lint Helm charts
        run: |
          for chart in charts/*/; do
            echo "Linting $chart..."
            helm lint "$chart"
          done
      - name: Run chart-testing (lint)
        uses: helm/chart-testing-action@v2
      - name: Run chart-testing lint
        run: ct lint --config .github/ct.yaml --all
  release:
    runs-on: github-runner
    needs: lint
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  package:
    runs-on: github-runner
    needs: lint
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package and push Helm charts to GHCR
        run: |
          # Convert repository owner to lowercase for OCI registry
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          for chart in charts/*/; do
            chart_name=$(basename "$chart")
            echo "Packaging $chart_name..."
            helm package "$chart" --destination .helm-packages

            # Get the packaged file name
            pkg_file=$(ls .helm-packages/${chart_name}-*.tgz | head -1)

            echo "Pushing $pkg_file to ghcr.io..."
            helm push "$pkg_file" oci://ghcr.io/${REPO_OWNER}/charts
          done

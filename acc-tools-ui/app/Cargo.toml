[package]
name = "acc-tools-ui"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
acc-session-viewer-lib = { path = "../../acc-session-viewer/lib" }
motec-viewer-lib = { path = "../../motec-viewer/lib" }
acc-tools-ui-components = { path = "../../acc-tools-ui-components" }

# Force wasm target support on getrandom (used transitively by leptos, gloo-net et al.)
getrandom = { version = "0.4", features = ["wasm_js"] } # renovate: ignore
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }

# CSR dependencies
wasm-bindgen = { version = "0.2", optional = true }
gloo-net = { version = "0.6", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = [
    "DomRect",
    "Element",
    "Event",
    "File",
    "FileList",
    "FileReader",
    "HtmlInputElement",
    "MouseEvent",
    "ProgressEvent",
    "Storage",
    "SvgElement",
    "Window",
] }

# SSR dependencies
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
http = { version = "1", optional = true }

[features]
default = []
csr = [
    "leptos/csr",
    "acc-tools-ui-components/csr",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:console_error_panic_hook",
    "dep:js-sys",
    "dep:getrandom03",
]
hydrate = [
    "leptos/hydrate",
    "acc-tools-ui-components/hydrate",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:console_error_panic_hook",
    "dep:js-sys",
    "dep:getrandom03",
]
web = [
    "csr",
    "dep:gloo-net",
]
ssr = [
    "leptos/ssr",
    "acc-tools-ui-components/ssr",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:http",
]

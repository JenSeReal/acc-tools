[package]
name = "acc-race-session-reader-ui-frontend"
version = "0.1.0"
edition.workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
acc-race-session-reader-lib = { path = "../acc-race-session-reader-lib" }
web-sys = { version = "0.3", features = [
    "Blob",
    "Clipboard",
    "Event",
    "File",
    "FileList",
    "FileReader",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Navigator",
    "ProgressEvent",
    "Window",
] }

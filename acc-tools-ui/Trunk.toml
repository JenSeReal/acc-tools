[build]
target = "./index.html"
dist = "./dist"

[watch]
ignore = ["./src-tauri", "./dist"]

[serve]
port = 1420
open = false

[[proxy]]
backend = "http://localhost:8080/api"
rewrite = "/api"

[[hooks]]
stage = "pre_build"
command = "npx"
command_arguments = ["@tailwindcss/cli", "-i", "../acc-tools-ui-components/style/tailwind.css", "-o", "./tailwind-output.css", "--minify"]

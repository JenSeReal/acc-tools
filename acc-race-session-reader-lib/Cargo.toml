[package]
name = "acc-race-session-reader-lib"
version = "0.1.0"
edition = "2024"

[lib]
name = "acc_race_session_reader_lib"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"
thiserror = "2.0"
miette = { version = "7.0", features = ["fancy"] }
encoding_rs = "0.8"

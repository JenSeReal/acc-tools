[package]
name = "acc-session-reader-app"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
serde = { version = "1", features = ["derive"] }
acc-session-reader-lib = { path = "../lib" }
acc-ui-components = { path = "../../acc-ui-components" }

# CSR dependencies
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

# SSR dependencies
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
http = { version = "1", optional = true }

[features]
default = []
csr = [
    "leptos/csr",
    "acc-ui-components/csr",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
]
hydrate = [
    "leptos/hydrate",
    "acc-ui-components/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
]
ssr = [
    "leptos/ssr",
    "acc-ui-components/ssr",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:http",
]

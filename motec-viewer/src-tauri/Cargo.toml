[package]
name = "motec-viewer-tauri"
version = "0.1.0"
description = "MoTeC Telemetry Viewer Desktop App"
authors = ["you"]
edition.workspace = true

[lib]
name = "motec_viewer_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

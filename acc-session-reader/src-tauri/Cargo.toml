[package]
name = "acc-session-reader-tauri"
version = "0.1.0"
description = "ACC Race Session Reader Desktop App"
authors = ["you"]
edition.workspace = true

[lib]
name = "acc_session_reader_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
